server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Semua directive location HARUS ada di dalam server { ... }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # TANPA trailing path setelah host:port, supaya prefix /api/
        # tetap dipertahankan saat diteruskan ke backend.
        # /api/login (frontend) -> http://api:8080/api/login (backend)
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}